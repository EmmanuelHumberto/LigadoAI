# COUS v3.0 — Composite Scoring Reranker
# Combina 4 dimensões de score conforme Documento I, Seção I.8
stage: rerank
technique: reranking
variant: composite
knobs:
  # Pesos por dimensão (devem somar ~1.0)
  weights:
    semantic: 0.40
    document: 0.25
    historical: 0.25
    causal: 0.10
  # Máximo de documentos no contexto final
  top_n: 5
  # Regra de diversidade: máximo de chunks por documento
  diversity:
    max_per_document: 2
    exceptions:
      - document_score_gte: 1.0  # datasheets do fabricante ignoram o limite